version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: email_processor_db
    environment:
      POSTGRES_DB: email_processor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  email_processor:
    build: .
    container_name: email_processor_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/email_processor_db
      - SCHEDULER_INTERVAL_MINUTES=30
      - DEBUG=True
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./emails_backup:/app/emails_backup
    restart: unless-stopped

volumes:
  postgres_data:
